{% block content %}
{% include "head/header.html" %}


<head>
    <title>Formulari</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #3a6ea5;
            text-align: center;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        form {
            width: 50%;
            margin: 30px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        label {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="submit"] {
            background-color: #3a6ea5;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #2a4d72;
        }

        .form-container {
            width: 70%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Formulari </h2>
        <form action="" method="POST">
            {% csrf_token %}
            {{ alumne_form.as_p }}
            <input type="submit" value="Enviar">
        </form>
    </div>
</body>
{% endblock %}
